services:
  web:
    build:
      context: .
      target: web
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 2s
      timeout: 3s
      retries: 15

  verify:
    build:
      context: .
      target: verify
    profiles: ["verify"]
    depends_on:
      web:
        condition: service_healthy
    environment:
      BASE_URL: http://web:80
